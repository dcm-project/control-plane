openapi: 3.0.4

info:
  title: DCM Database Specification
  description: |
    Provider-agnostic database specification.

    This schema defines minimal portable fields for database provisioning.
    Database-specific configuration (HA, backups, connection settings,
    engine parameters) should be specified via provider_hints.
  version: v1alpha1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

paths: {}

components:
  schemas:
    DatabaseSpec:
      type: object
      description: |
        Provider-agnostic database specification.

        Includes common fields (service_type, metadata, provider_hints)
        plus fields for engine, version, and resources.

        Providers translate this specification to their native format.
      allOf:
        - $ref: '../common.yaml#/components/schemas/CommonFields'
        - type: object
          required:
            - engine
            - version
            - resources
          properties:
            engine:
              type: string
              description: |
                Database engine type.

                Common engines include:
                - Relational: postgresql, mysql, mariadb, cockroachdb
                - Document: mongodb, couchdb
                - Key-Value: redis, memcached, etcd
                - Search: elasticsearch, opensearch
                - Time-series: influxdb, timescaledb
                - Graph: neo4j
                - Wide-column: cassandra, scylladb
              example: postgresql

            version:
              type: string
              description: |
                Database engine version.
                Providers map this to their supported versions.
              example: "15"

            resources:
              $ref: '#/components/schemas/DatabaseResources'

            replicas:
              type: integer
              description: Number of database replicas
              minimum: 1
              example: 3

            network:
              $ref: '#/components/schemas/DatabaseNetwork'

          additionalProperties: true

    DatabaseResources:
      type: object
      description: Resource allocation for the database
      required:
        - cpu
        - memory
        - storage
      properties:
        cpu:
          $ref: "#/components/schemas/DatabaseCpu"
        memory:
          $ref: "#/components/schemas/DatabaseMemory"
        storage:
          type: string
          description: Storage size with unit suffix
          pattern: '^[0-9]+(MB|GB|TB)$'
          example: 100GB
      additionalProperties: true

    DatabaseCpu:
      type: object
      description: Database CPU constraints
      required:
        - min
        - max
      properties:
        min:
          type: string
          description: Minimum guaranteed CPU in whole cores or millicores
          pattern: '^[1-9][0-9]*m?$'
          example: "500m"
        max:
          type: string
          description: Maximum allowed CPU in whole cores or millicores
          pattern: '^[1-9][0-9]*m?$'
          example: "2000m"
      additionalProperties: true

    DatabaseMemory:
      type: object
      description: Database memory constraints
      required:
        - min
        - max
      properties:
        min:
          type: string
          description: Minimum guaranteed memory with unit suffix
          pattern: '^[0-9]+(MB|GB|TB)$'
          example: "512MB"
        max:
          type: string
          description: Maximum allowed memory with unit suffix
          pattern: '^[0-9]+(MB|GB|TB)$'
          example: "2GB"
      additionalProperties: true

    DatabaseNetwork:
      type: object
      description: Network configuration for the database
      properties:
        port:
          type: integer
          description: Port number for the database to listen on
          minimum: 1
          maximum: 65536
        visibility:
          type: string
          desciption: Database visibility
          enum:
            - internal
            - external
      additionalProperties: true
