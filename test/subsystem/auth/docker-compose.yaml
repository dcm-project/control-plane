# Auth subsystem test stack. Runs with AUTH_DISABLED=false to exercise
# the full authentication middleware, JIT provisioning, and OIDC flow.

services:
  postgres:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    environment:
      POSTGRESQL_DATABASE: auth_test
      POSTGRESQL_USER: ${POSTGRES_USER:-test_user}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
      POSTGRESQL_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-test_user} -d auth_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates a second database with no pre-seeded admin actor, used
  # by control-plane-configa (TC-29) so it doesn't collide with the admin
  # actor already seeded into auth_test by the main control-plane service.
  db-init-noadmin:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        PGPASSWORD=${POSTGRES_PASSWORD:-test_password} psql -h postgres -U postgres -tc
        "SELECT 1 FROM pg_database WHERE datname = 'auth_test_noadmin'" | grep -q 1 ||
        PGPASSWORD=${POSTGRES_PASSWORD:-test_password} psql -h postgres -U postgres -c
        "CREATE DATABASE auth_test_noadmin OWNER ${POSTGRES_USER:-test_user}"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /opt/keycloak/data/import && content=$$(cat /opt/keycloak/data/realm-template.json) && printf '%s' \"$${content//REPLACE_DCM_DEV_PASSWORD/$$DCM_DEV_USER_PASSWORD}\" > /opt/keycloak/data/import/realm-export.json && exec /opt/keycloak/bin/kc.sh start-dev --import-realm"
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      DCM_DEV_USER_PASSWORD: ${DCM_DEV_USER_PASSWORD:-admin}
    ports:
      - "28180:8080"
    volumes:
      - ../../../deploy/keycloak/realm-export.json:/opt/keycloak/data/realm-template.json:ro,z
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  control-plane:
    build:
      context: ../../..
      dockerfile: Containerfile
    image: auth-subsystem-control-plane:latest
    environment:
      BIND_ADDRESS: "0.0.0.0:8080"
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth_test
      DB_USER: ${POSTGRES_USER:-test_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
      NATS_DISABLED: "true"
      AUTH_DISABLED: "false"
      AUTH_PROXY_SECRET: "test-proxy-secret"
      AUTH_ISSUER_URL: "http://keycloak:8080/realms/dcm"
      AUTH_JWT_AUDIENCE: "dcm-api"
      AUTH_CACHE_TTL: "2s"
      DCM_ADMIN_SUBJECT: "56deb662-4820-5d83-b828-f4beb11a5fa7"
      LOG_LEVEL: debug
    ports:
      - "28080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1alpha1/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  # TC-13: Config C (proxy-only, no JWT). No AUTH_ISSUER_URL means no
  # JWTValidator is configured, so Bearer tokens must be ignored and the
  # proxy-header path used instead. Shares the auth_test DB - admin seeding
  # is idempotent so this does not conflict with the `control-plane` service.
  # Reuses the image built by `control-plane` above (same source, different
  # env) instead of rebuilding, to avoid tripling CI build time.
  control-plane-configc:
    image: auth-subsystem-control-plane:latest
    environment:
      BIND_ADDRESS: "0.0.0.0:8080"
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth_test
      DB_USER: ${POSTGRES_USER:-test_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
      NATS_DISABLED: "true"
      AUTH_DISABLED: "false"
      AUTH_PROXY_SECRET: "test-proxy-secret"
      DCM_ADMIN_SUBJECT: "56deb662-4820-5d83-b828-f4beb11a5fa7"
      LOG_LEVEL: debug
    ports:
      - "28081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1alpha1/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  # TC-29: Config A (auth disabled) with an empty DCM_ADMIN_SUBJECT. Uses its
  # own database (auth_test_noadmin) so the admin-actor-count assertion isn't
  # polluted by the admin actor seeded into auth_test by `control-plane`.
  # Reuses the image built by `control-plane` above instead of rebuilding.
  control-plane-configa:
    image: auth-subsystem-control-plane:latest
    environment:
      BIND_ADDRESS: "0.0.0.0:8080"
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth_test_noadmin
      DB_USER: ${POSTGRES_USER:-test_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
      NATS_DISABLED: "true"
      AUTH_DISABLED: "true"
      DCM_ADMIN_SUBJECT: ""
      LOG_LEVEL: debug
    ports:
      - "28082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_started
      db-init-noadmin:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1alpha1/health"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres_data: {}
