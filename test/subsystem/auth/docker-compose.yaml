# Auth subsystem test stack. Shared env: test/subsystem/.env (see .env.example).

services:
  postgres:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    env_file: ../.env
    environment:
      POSTGRESQL_DATABASE: auth_test
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRESQL_USER\" -d auth_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.1
    command: ["start-dev", "--import-realm"]
    env_file: ../.env
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "28180:8080"
    volumes:
      - ../../../deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro,z
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  control-plane:
    build:
      context: ../../..
      dockerfile: Containerfile
    env_file: ../.env
    environment:
      BIND_ADDRESS: "0.0.0.0:8080"
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth_test
      NATS_DISABLED: "true"
      AUTH_DISABLED: "false"
      AUTH_CACHE_TTL: "2s"
      LOG_LEVEL: debug
    ports:
      - "28080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1alpha1/health"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres_data: {}
