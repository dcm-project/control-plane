services:
  postgres:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    environment:
      POSTGRESQL_DATABASE: service-provider
      POSTGRESQL_USER: admin
      POSTGRESQL_PASSWORD: adminpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d service-provider"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: docker.io/library/nats:2-alpine
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--version"]
      interval: 5s
      timeout: 5s
      retries: 5

  provider-wiremock:
    image: wiremock/wiremock:3x
    ports:
      - "9090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  service-provider-manager:
    build:
      context: ../../..
      dockerfile: Containerfile.sp
    environment:
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: service-provider
      DB_USER: admin
      DB_PASS: adminpass
      SVC_ADDRESS: ":8080"
      NATS_URL: "nats://nats:4222"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      provider-wiremock:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1alpha1/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  nats_data:
